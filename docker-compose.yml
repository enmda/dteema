services:
  postgres:
    image: postgres:15
    container_name: dteema_postgres
    environment:
      POSTGRES_USER: dteema_user
      POSTGRES_PASSWORD: dteema_pass
      POSTGRES_DB: dteema_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dteema_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dteema_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dteema.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dteema_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  dteema_network:
    driver: bridge