databaseChangeLog:
  - changeSet:
      id: v0.4-1-create-room-members-table
      author: elvin
      changes:
        - createTable:
            tableName: room_members
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_room_members
                    nullable: false

              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: MEMBER
                  constraints:
                    nullable: false

              - column:
                  name: joined_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: room_members

  - changeSet:
      id: v0.4-2-add-room-members-foreign-keys
      author: elvin
      changes:
        - addForeignKeyConstraint:
            baseTableName: room_members
            baseColumnNames: room_id
            constraintName: fk_room_members_room_id
            referencedTableName: rooms
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: room_members
            baseColumnNames: user_id
            constraintName: fk_room_members_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: room_members
            constraintName: fk_room_members_room_id
        - dropForeignKeyConstraint:
            baseTableName: room_members
            constraintName: fk_room_members_user_id

  - changeSet:
      id: v0.4-3-add-room-members-constraints
      author: elvin
      changes:
        - addUniqueConstraint:
            tableName: room_members
            columnNames: room_id, user_id
            constraintName: uk_room_members_room_user

      rollback:
        - dropUniqueConstraint:
            tableName: room_members
            constraintName: uk_room_members_room_user

  - changeSet:
      id: v0.4-4-create-room-members-indexes
      author: elvin
      changes:
        - createIndex:
            tableName: room_members
            indexName: idx_room_members_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: room_members
            indexName: idx_room_members_room_id
            columns:
              - column:
                  name: room_id

        - createIndex:
            tableName: room_members
            indexName: idx_room_members_role
            columns:
              - column:
                  name: role

        - createIndex:
            tableName: room_members
            indexName: idx_room_members_joined_at
            columns:
              - column:
                  name: joined_at
                  descending: true

      rollback:
        - dropIndex:
            tableName: room_members
            indexName: idx_room_members_user_id
        - dropIndex:
            tableName: room_members
            indexName: idx_room_members_room_id
        - dropIndex:
            tableName: room_members
            indexName: idx_room_members_role
        - dropIndex:
            tableName: room_members
            indexName: idx_room_members_joined_at