databaseChangeLog:
  - changeSet:
      id: v0.3-1-create-messages-table
      author: elvin
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_messages
                    nullable: false

              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: is_edited
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: messages

  - changeSet:
      id: v0.3-2-add-messages-foreign-keys
      author: elvin
      changes:
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: room_id
            constraintName: fk_messages_room_id
            referencedTableName: rooms
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: user_id
            constraintName: fk_messages_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: messages
            constraintName: fk_messages_room_id
        - dropForeignKeyConstraint:
            baseTableName: messages
            constraintName: fk_messages_user_id

  - changeSet:
      id: v0.3-3-create-messages-indexes
      author: elvin
      changes:
        - createIndex:
            tableName: messages
            indexName: idx_messages_room_id
            columns:
              - column:
                  name: room_id

        - createIndex:
            tableName: messages
            indexName: idx_messages_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: messages
            indexName: idx_messages_created_at
            columns:
              - column:
                  name: created_at
                  descending: true

        - createIndex:
            tableName: messages
            indexName: idx_messages_room_created
            columns:
              - column:
                  name: room_id
              - column:
                  name: created_at
                  descending: true

        - createIndex:
            tableName: messages
            indexName: idx_messages_is_edited
            columns:
              - column:
                  name: is_edited

      rollback:
        - dropIndex:
            tableName: messages
            indexName: idx_messages_room_id
        - dropIndex:
            tableName: messages
            indexName: idx_messages_user_id
        - dropIndex:
            tableName: messages
            indexName: idx_messages_created_at
        - dropIndex:
            tableName: messages
            indexName: idx_messages_room_created
        - dropIndex:
            tableName: messages
            indexName: idx_messages_is_edited