databaseChangeLog:
  - changeSet:
      id: v0.5-1-create-refresh-tokens-table
      author: elvin
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_tokens
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: token
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_refresh_tokens_token

              - column:
                  name: expiry_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: device_info
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

              - column:
                  name: ip_address
                  type: VARCHAR(45)
                  constraints:
                    nullable: true

      rollback:
        - dropTable:
            tableName: refresh_tokens

  - changeSet:
      id: v0.5-2-add-refresh-tokens-foreign-keys
      author: elvin
      changes:
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            constraintName: fk_refresh_tokens_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: refresh_tokens
            constraintName: fk_refresh_tokens_user_id

  - changeSet:
      id: v0.5-3-create-refresh-tokens-indexes
      author: elvin
      changes:
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_token
            unique: true
            columns:
              - column:
                  name: token

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expiry_date
            columns:
              - column:
                  name: expiry_date

      rollback:
        - dropIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
        - dropIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_token
        - dropIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expiry_date